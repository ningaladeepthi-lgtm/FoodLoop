services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    networks:
      - foodloop-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - foodloop-network

networks:
  foodloop-network:
    driver: bridge
