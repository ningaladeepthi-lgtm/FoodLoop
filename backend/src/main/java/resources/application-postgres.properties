# Production PostgreSQL Database Configuration
server.port=8080
spring.application.name=foodloop-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/foodloopdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.secret=FoodLoopSecretKey98765432101234567890123456789012345678901234567890
app.jwt.expiration-ms=86400000
